/* ------------------------------------------------------------------ */
/*  TEXT-TO-SPEECH                                                     */
/* ------------------------------------------------------------------ */
function speak(text) {
  try {
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.9;
    window.speechSynthesis.speak(u);
  } catch (e) {
    /* speech not available on this device — button just won't speak */
  }
}

function SpeakerButton({ text, big }) {
  return (

      aria-label="Read this aloud"
      className={`rounded-full flex items-center justify-center shrink-0 active:scale-90 transition ${big ? "w-11 h-11" : "w-9 h-9"}`}
      style={{ background: big ? COLOR.navy : `${COLOR.navy}14` }}
    >
      <Volume2 size={big ? 22 : 18} color={big ? "#fff" : COLOR.navy} />
    </button>
  );
}

/* ------------------------------------------------------------------ */
/*  VISITOR COUNTER — decorative animated count-up (no real backend)   */
/* ------------------------------------------------------------------ */
function useCountUp(target, duration = 1400) {
  const [value, setValue] = useState(0);
  useEffect(() => {
    let start = null;
    let raf;
    const step = (ts) => {
      if (!start) start = ts;
      const progress = Math.min((ts - start) / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      setValue(Math.floor(eased * target));
      if (progress < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [target, duration]);
  return value;
}

function openPrintable(title, innerHtml, onFail) {
  try {
    const w = window.open("", "_blank");
    if (!w) { onFail("popup"); return; }
    w.document.write(
      `<html><head><title>${title}</title><meta charset="utf-8"/>
       <style>
         body{font-family:Georgia,'Times New Roman',serif;padding:36px;color:#111;max-width:700px;margin:0 auto;}
         h1{font-family:Georgia,serif;font-size:28px;margin-bottom:4px;}
         .sub{font-size:16px;color:#555;margin-bottom:24px;}
         h2{font-size:20px;margin-top:26px;margin-bottom:8px;}
         p,li{font-size:17px;line-height:1.6;}
         .line{border-bottom:2px solid #bbb;height:34px;margin-bottom:6px;}
       </style></head><body>${innerHtml}
       <script>window.onload=function(){setTimeout(function(){window.print();},250);}<\/script>
       </body></html>`
    );
    w.document.close();
    w.focus();
  } catch (e) {
    onFail("error");
  }
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    return false;
  }
}

function CupTracker({ cups, setCups }) {
  const max = 8;
  return (
    <div className="rounded-3xl p-4 bg-white shadow-md mb-6" style={{ border: `3px solid ${COLOR.blue}33` }}>
      <div className="flex items-center justify-between mb-3">

        <div className="flex items-center gap-2">
          <SpeakerButton text={`You have logged ${cups} cups of water today. Tap the minus button to remove one, or the plus button to add one.`} />
          <button onClick={() => setCups((c) => Math.max(0, c - 1))} className="w-11 h-11 rounded-2xl flex items-center justify-center active:scale-90 transition" style={{ background: `${COLOR.blue}18` }}>
            <Minus size={22} color={COLOR.blue} />
          </button>
          <button onClick={() => setCups((c) => Math.min(max, c + 1))} className="w-11 h-11 rounded-2xl flex items-center justify-center active:scale-90 transition" style={{ background: COLOR.blue }}>
            <Plus size={22} color="#fff" />
          </button>
        </div>
      </div>
      <div className="flex gap-1.5">
        {Array.from({ length: max }).map((_, i) => (
          <div key={i} className="flex-1 h-6 rounded-full" style={{ background: i < cups ? COLOR.blue : `${COLOR.blue}18` }} />
        ))}
      </div>
    </div>
  );
}

        <div className="flex flex-col gap-3">
          {SCAM_TIPS.map((t) => (
            <ExpandableTip key={t.key} Icon={t.Icon} question={t.q} answer={t.a} accent={COLOR.brick} open={openTip === t.key} onToggle={() => setOpenTip(openTip === t.key ? null : t.key)} />
          ))}
        </div>
      </div>

      <ReturnHomeButton go={go} />
    </div>
  );
}

/*  DOCTOR VISIT PREP SCREEN                                             */
/* ------------------------------------------------------------------ */
const MED_SUBITEMS = [
  { key: "bottles", label: "Prescription Bottles" },
  { key: "supplements", label: "Supplements / Vitamins" },
  { key: "drops", label: "Eye Drops / Inhalers" },
];

function Toggle({ on, onClick }) {
  return (
    <button onClick={onClick} aria-pressed={on} className="w-16 h-9 rounded-full relative shrink-0 transition" style={{ background: on ? COLOR.sageDeep : "#D9D2C6" }}>
      <div className="absolute top-1 w-7 h-7 rounded-full bg-white shadow transition-all" style={{ left: on ? 32 : 4 }} />
    </button>
  );
}

/* Voice-or-type input. Speech recognition needs microphone access,
   which some embedded/preview browsers block — when that happens we
   show a clear message instead of a mic button that silently fails. */
function VoiceOrTextAdd({ placeholder, onAdd }) {
  const [text, setText] = useState("");
  const [status, setStatus] = useState("idle"); // idle | listening | unsupported | denied
  const recogRef = useRef(null);

  const startListening = () => {
    const SR = typeof window !== "undefined" && (window.SpeechRecognition || window.webkitSpeechRecognition);
    if (!SR) { setStatus("unsupported"); return; }
    try {
      const recog = new SR();
      recog.lang = "en-US";
      recog.interimResults = false;
      recog.onstart = () => setStatus("listening");
      recog.onresult = (e) => {
        const said = e.results[0][0].transcript;
        setText((t) => (t ? `${t} ${said}` : said));
        setStatus("idle");
      };
      recog.onerror = (e) => setStatus(e.error === "not-allowed" || e.error === "service-not-allowed" ? "denied" : "unsupported");
      recog.onend = () => setStatus((s) => (s === "listening" ? "idle" : s));
      recogRef.current = recog;
      recog.start();
    } catch (e) {
      setStatus("unsupported");
    }
  };

  const submit = () => { if (text.trim()) { onAdd(text.trim()); setText(""); } };

  return (
    <div className="mt-2">
      <div className="flex gap-2">
        <input
          value={text}
          onChange={(e) => setText(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && submit()}
          placeholder={placeholder}
          className="flex-1 rounded-xl px-3 py-3 text-base"
          style={{ ...body, border: `2px solid ${COLOR.navy}33` }}
        />
        <button onClick={startListening} aria-label="Speak instead of typing" className="w-12 rounded-xl flex items-center justify-center shrink-0" style={{ background: status === "listening" ? COLOR.brick : `${COLOR.navy}14` }}>
          <Mic size={20} color={status === "listening" ? "#fff" : COLOR.navy} />
        </button>
        <button onClick={submit} className="w-12 rounded-xl flex items-center justify-center shrink-0" style={{ background: COLOR.navy }}>
          <Plus size={20} color="#fff" />
        </button>
      </div>
      {status === "listening" && (
        <p className="text-sm mt-1 font-bold" style={{ ...body, color: COLOR.brickDeep }}>🎙️ Listening — speak now…</p>
      )}
      {(status === "unsupported" || status === "denied") && (
        <p className="text-sm mt-1 font-bold" style={{ ...body, color: "#8A8072" }}>
          Voice input isn't available in this preview window — please type it in above instead.
        </p>
      )}
    </div>
  );
}

function DoctorScreen({ go, doctor, setDoctor, hydration, scamAnswers }) {
  const [printStatus, setPrintStatus] = useState(null);
  const [shareStatus, setShareStatus] = useState(null);
  const [showCard, setShowCard] = useState(false);

  const setOn = (key, val) => setDoctor((d) => ({ ...d, [key]: val }));
  const toggleMedItem = (key) => setDoctor((d) => ({ ...d, medItems: { ...d.medItems, [key]: !d.medItems[key] } }));
  const addMed = (text) => setDoctor((d) => ({ ...d, customMeds: [...d.customMeds, text] }));
  const addQuestion = (text) => setDoctor((d) => ({ ...d, customQuestions: [...d.customQuestions, text] }));

  const readyCount = ["medsOn", "labsOn", "questionsOn"].filter((k) => doctor[k]).length;
  const readyColor = readyCount === 0 ? "#B7AE9E" : readyCount < 3 ? COLOR.gold : COLOR.sageDeep;
  const readyLabel = readyCount === 0 ? "Not Ready Yet – Check items above" : readyCount < 3 ? "Almost Ready" : "Fully Prepared for Your Appointment!";

  const activeSymptoms = [
    ...SYMPTOMS.filter((s) => hydration.signs[s.key]).map((s) => s.label),
    ...BATHROOM_SIGNS.filter((s) => hydration.signs[s.key]).map((s) => s.label),
  ];
  const urineNote = hydration.colorIdx !== null ? `${URINE_COLORS[hydration.colorIdx].label} — ${URINE_COLORS[hydration.colorIdx].status}` : null;
  const flaggedScam = SCAM_QUESTIONS.filter((q) => scamAnswers[q.key] === "yes").map((q) => q.label);
  const dateStr = new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  const medsList = [...MED_SUBITEMS.filter((m) => doctor.medItems[m.key]).map((m) => m.label), ...doctor.customMeds];

  const summaryText = [
    `Doctor Visit Summary — ${dateStr}`,
    "",
    "Symptoms logged today:",
    ...([urineNote, ...activeSymptoms].filter(Boolean).length ? [urineNote, ...activeSymptoms].filter(Boolean).map((s) => `- ${s}`) : ["- None logged"]),
    "",
    "Items to discuss:",
    doctor.medsOn ? `- Medications: ${medsList.join(", ") || "list to bring"}` : null,
    doctor.labsOn ? "- Bring recent lab results / Medicare statements" : null,
    doctor.questionsOn ? `- Questions: ${doctor.customQuestions.join("; ") || "see notes"}` : null,
    "",
    "Billing / fraud questions to raise:",
    ...(flaggedScam.length ? flaggedScam.map((s) => `- ${s}`) : ["- None flagged"]),
  ].filter((l) => l !== null).join("\n");

  const printHtml = `
    <h1>Doctor Visit Worksheet</h1>
    <p class="sub">${dateStr} &nbsp;•&nbsp; Geri-Check</p>
    <h2>Symptoms noted</h2>
    <p>${[urineNote, ...activeSymptoms].filter(Boolean).join(", ") || "—"}</p>
    <h2>Medications to bring up</h2>
    <p>${medsList.join(", ") || "—"}</p>
    <h2>Questions to ask</h2>
    <p>${doctor.customQuestions.join(", ") || "—"}</p>
    <h2>Extra notes — write below</h2>
    ${[1,2,3,4,5,6].map(() => '<div class="line"></div>').join("")}
  `;

  const handlePrint = () => {
    setPrintStatus(null);
    openPrintable("Doctor Visit Worksheet", printHtml, () => setPrintStatus("blocked"));
  };

  const handleCopy = async () => {
    const ok = await copyText(summaryText);
    setShareStatus(ok ? "copied" : "failed");
    setTimeout(() => setShareStatus(null), 4000);
  };

  return (
    <div className="pb-32">
      <TopBar
        title="Doctor Prep"
        subtitle="Get ready before you go"
        onBack={() => go("home")}
        listenText="This is Doctor Prep. Turn on each switch for what you want to bring or discuss at your appointment. Turning one on shows more choices. Near the bottom, you can view a large summary card, print a worksheet, or copy the summary to send to family."
      />

      <div className="px-6 mt-6 flex flex-col gap-4">
        {/* Medications */}
        <div className="rounded-3xl bg-white shadow-md overflow-hidden" style={{ border: `3px solid ${doctor.medsOn ? COLOR.sageDeep : COLOR.navy + "22"}` }}>
          <div className="p-4 flex items-center gap-3">
            <div className="w-14 h-14 rounded-2xl flex items-center justify-center shrink-0" style={{ background: doctor.medsOn ? `${COLOR.sageDeep}20` : `${COLOR.navy}12` }}>
              <Pill size={28} color={doctor.medsOn ? COLOR.sageDeep : COLOR.navy} strokeWidth={2.2} />
            </div>
            <span className="text-lg flex-1" style={{ ...body, fontWeight: 800, color: COLOR.ink }}>Bring Medication List</span>
            <SpeakerButton text="Bring medication list. Turn this switch on to check off prescription bottles, supplements, or eye drops and inhalers, and to add any others by typing or speaking." />
            <Toggle on={doctor.medsOn} onClick={() => setOn("medsOn", !doctor.medsOn)} />
          </div>
          {doctor.medsOn && (
            <div className="px-4 pb-4">
              <div className="flex flex-col gap-2 mb-2">
                {MED_SUBITEMS.map((m) => (
                  <button key={m.key} onClick={() => toggleMedItem(m.key)} className="flex items-center gap-3 text-left">
                    <div className="w-7 h-7 rounded-lg flex items-center justify-center shrink-0" style={{ background: doctor.medItems[m.key] ? COLOR.sageDeep : "#fff", border: `2px solid ${COLOR.sageDeep}` }}>
                      {doctor.medItems[m.key] && <Check size={16} color="#fff" />}
                    </div>
                    <span className="text-base" style={{ ...body, fontWeight: 700, color: COLOR.ink }}>{m.label}</span>
                  </button>
                ))}
                {doctor.customMeds.map((m, i) => (
                  <div key={i} className="text-base pl-10" style={{ ...body, color: COLOR.sageDeep, fontWeight: 700 }}>• {m}</div>
                ))}
              </div>
              <VoiceOrTextAdd placeholder="Add a medication name" onAdd={addMed} />
            </div>
          )}
        </div>

        {/* Labs */}
        <div className="rounded-3xl bg-white shadow-md overflow-hidden" style={{ border: `3px solid ${doctor.labsOn ? COLOR.sageDeep : COLOR.navy + "22"}` }}>
          <div className="p-4 flex items-center gap-3">
            <div className="w-14 h-14 rounded-2xl flex items-center justify-center shrink-0" style={{ background: doctor.labsOn ? `${COLOR.sageDeep}20` : `${COLOR.navy}12` }}>
              <FileText size={28} color={doctor.labsOn ? COLOR.sageDeep : COLOR.navy} strokeWidth={2.2} />
            </div>
            <span className="text-lg flex-1" style={{ ...body, fontWeight: 800, color: COLOR.ink }}>Bring Lab & Medicare Statements</span>
            <SpeakerButton text="Bring lab and Medicare statements. Turn this switch on for a reminder to bring recent lab results or any suspicious bills you flagged in the Scam Checker." />
            <Toggle on={doctor.labsOn} onClick={() => setOn("labsOn", !doctor.labsOn)} />
          </div>
          {doctor.labsOn && (
            <div className="px-4 pb-4">
              <div className="rounded-2xl p-3 flex items-start gap-2" style={{ background: `${COLOR.blue}12` }}>
                <Info size={20} color={COLOR.blueDeep} className="mt-0.5 shrink-0" />
                <p className="text-sm" style={{ ...body, fontWeight: 600, color: COLOR.ink }}>
                  Bring recent lab results or any suspicious bills you checked in the Scam Shield screen so your doctor can verify them.
                  {flaggedScam.length > 0 && ` (${flaggedScam.length} flagged item${flaggedScam.length > 1 ? "s" : ""} from Scam Shield.)`}
                </p>
              </div>
            </div>
          )}
        </div>

        {/* Questions */}
        <div className="rounded-3xl bg-white shadow-md overflow-hidden" style={{ border: `3px solid ${doctor.questionsOn ? COLOR.sageDeep : COLOR.navy + "22"}` }}>
          <div className="p-4 flex items-center gap-3">
            <div className="w-14 h-14 rounded-2xl flex items-center justify-center shrink-0" style={{ background: doctor.questionsOn ? `${COLOR.sageDeep}20` : `${COLOR.navy}12` }}>
              <HelpCircle size={28} color={doctor.questionsOn ? COLOR.sageDeep : COLOR.navy} strokeWidth={2.2} />
            </div>
            <span className="text-lg flex-1" style={{ ...body, fontWeight: 800, color: COLOR.ink }}>Ask About Symptoms</span>
            <SpeakerButton text="Ask about symptoms. Turn this switch on to see symptoms you already logged on the Water page, and to add your own questions by typing or speaking." />
            <Toggle on={doctor.questionsOn} onClick={() => setOn("questionsOn", !doctor.questionsOn)} />
          </div>
          {doctor.questionsOn && (
            <div className="px-4 pb-4">
              {(urineNote || activeSymptoms.length > 0) && (
                <p className="text-sm mb-2" style={{ ...body, fontWeight: 700, color: COLOR.sageDeep }}>
                  Selected earlier: {[urineNote, ...activeSymptoms].filter(Boolean).join(", ")}
                </p>
              )}
              {doctor.customQuestions.map((q, i) => (
                <div key={i} className="text-base" style={{ ...body, color: COLOR.ink, fontWeight: 700 }}>• {q}</div>
              ))}
              <VoiceOrTextAdd placeholder="Add a question for your doctor" onAdd={addQuestion} />
            </div>
          )}
        </div>
      </div>

      <div className="px-6 mt-8">
        <div className="rounded-3xl p-5 bg-white shadow-md flex items-center gap-5" style={{ border: `3px solid ${readyColor}` }}>
          <ReadinessRing fraction={readyCount / 3} color={readyColor} />
          <div className="flex-1">
            <div className="text-lg" style={{ ...display, fontWeight: 700, color: COLOR.ink }}>My Visit Readiness</div>
            <div className="text-base mt-1" style={{ ...body, fontWeight: 700, color: readyColor }}>{readyLabel}</div>
          </div>
          <SpeakerButton text={`My visit readiness. ${readyLabel}`} />
        </div>

        <button onClick={() => setShowCard(true)} className="w-full mt-4 rounded-3xl py-5 text-xl font-extrabold flex items-center justify-center gap-3 active:scale-95 transition shadow-lg" style={{ background: COLOR.navy, color: "#fff", ...body }}>
          📱 View Doctor Summary Card
        </button>

        <div className="flex gap-3 mt-4">
          <button onClick={handlePrint} className="flex-1 rounded-3xl py-4 text-base font-extrabold flex items-center justify-center gap-2 active:scale-95 transition shadow-lg" style={{ background: COLOR.blue, color: "#fff", ...body }}>
            <Printer size={22} /> Print Sheet
          </button>
          <button onClick={handleCopy} className="flex-1 rounded-3xl py-4 text-base font-extrabold flex items-center justify-center gap-2 active:scale-95 transition shadow-lg" style={{ background: COLOR.roseDeep, color: "#fff", ...body }}>
            <Copy size={20} /> Copy Summary
          </button>
        </div>
        {printStatus === "blocked" && (
          <p className="text-sm mt-2 text-center font-bold" style={{ ...body, color: COLOR.brickDeep }}>
            Your browser blocked the print window pop-up. Please allow pop-ups for this page and tap Print Sheet again.
          </p>
        )}
        {shareStatus === "copied" && (
          <p className="text-sm mt-2 text-center font-bold" style={{ ...body, color: COLOR.sageDeep }}>
            Copied! Paste it into a text or email to send to family.
          </p>
        )}
        {shareStatus === "failed" && (
          <p className="text-sm mt-2 text-center font-bold" style={{ ...body, color: COLOR.brickDeep }}>
            Couldn't copy automatically — please select and copy the text from the summary card instead.
          </p>
        )}

        <div className="flex gap-3 mt-3">
          <a href={`mailto:?subject=${encodeURIComponent("Doctor Visit Summary")}&body=${encodeURIComponent(summaryText)}`} className="flex-1 rounded-2xl py-3 text-sm font-extrabold flex items-center justify-center gap-2 active:scale-95 transition" style={{ ...body, background: "#fff", color: COLOR.navy, border: `2px solid ${COLOR.navy}33` }}>
            <Send size={16} /> Open Email
          </a>
          <a href={`sms:?&body=${encodeURIComponent(summaryText)}`} className="flex-1 rounded-2xl py-3 text-sm font-extrabold flex items-center justify-center gap-2 active:scale-95 transition" style={{ ...body, background: "#fff", color: COLOR.navy, border: `2px solid ${COLOR.navy}33` }}>
            <Send size={16} /> Open Messages
          </a>
        </div>
        <p className="text-xs text-center mt-2" style={{ ...body, color: "#8A8072" }}>
          If Email or Messages doesn't open here, use Copy Summary above instead.
        </p>
      </div>

      <ReturnHomeButton go={go} />

      {showCard && (
        <div className="fixed inset-0 z-50 bg-white overflow-y-auto p-6">
          <div className="flex items-center justify-between mb-6">
            <button onClick={() => setShowCard(false)} className="flex items-center gap-2 text-lg font-extrabold" style={{ color: COLOR.navy }}>
              <ArrowLeft size={22} /> Close
            </button>
            <SpeakerButton text={`Doctor summary for ${dateStr}. Symptoms logged: ${[urineNote, ...activeSymptoms].filter(Boolean).join(", ") || "none"}. Items to discuss: ${[doctor.medsOn && "medications", doctor.labsOn && "labs", doctor.questionsOn && "questions"].filter(Boolean).join(", ") || "nothing selected yet"}. Fraud or billing questions: ${flaggedScam.join(", ") || "none flagged"}.`} big />
          </div>
          <h2 className="text-3xl mb-1" style={{ ...display, fontWeight: 800, color: "#000" }}>Doctor Summary</h2>
          <p className="text-xl mb-6" style={{ ...body, color: "#000", fontWeight: 700 }}>{dateStr}</p>

          <p className="text-2xl font-extrabold mb-2" style={{ ...body, color: "#000" }}>Symptoms Logged Today</p>
          {[urineNote, ...activeSymptoms].filter(Boolean).length === 0 ? (
            <p className="text-2xl mb-6" style={{ ...body, color: "#000" }}>None logged</p>
          ) : (
            <ul className="mb-6 pl-6 list-disc">{[urineNote, ...activeSymptoms].filter(Boolean).map((s) => (<li key={s} className="text-2xl mb-1" style={{ ...body, color: "#000" }}>{s}</li>))}</ul>
          )}

          <p className="text-2xl font-extrabold mb-2" style={{ ...body, color: "#000" }}>Items to Discuss</p>
          <ul className="mb-6 pl-6 list-disc">
            {doctor.medsOn && <li className="text-2xl mb-1" style={{ ...body, color: "#000" }}>Medications: {medsList.join(", ") || "bring list"}</li>}
            {doctor.labsOn && <li className="text-2xl mb-1" style={{ ...body, color: "#000" }}>Lab results / Medicare statements</li>}
            {doctor.questionsOn && <li className="text-2xl mb-1" style={{ ...body, color: "#000" }}>Questions: {doctor.customQuestions.join("; ") || "see notes"}</li>}
            {!doctor.medsOn && !doctor.labsOn && !doctor.questionsOn && <li className="text-2xl mb-1" style={{ ...body, color: "#000" }}>Nothing selected yet</li>}
          </ul>

          <p className="text-2xl font-extrabold mb-2" style={{ ...body, color: "#000" }}>Fraud / Billing Questions</p>
          {flaggedScam.length === 0 ? (
            <p className="text-2xl" style={{ ...body, color: "#000" }}>None flagged</p>
          ) : (
            <ul className="pl-6 list-disc">{flaggedScam.map((s) => (<li key={s} className="text-2xl mb-1" style={{ ...body, color: "#000" }}>{s}</li>))}</ul>
          )}
        </div>
      )}
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  ROOT APP                                                             */
/* ------------------------------------------------------------------ */
function GeriCheckApp() {
  const [screen, setScreen] = useState("home");
  const [contacts, setContacts] = useState({});

  const [colorIdx, setColorIdx] = useState(null);
  const [signs, setSigns] = useState({});
  const [cups, setCups] = useState(0);

  const [scamAnswers, setScamAnswers] = useState({});

  const [doctor, setDoctor] = useState({
    medsOn: false, labsOn: false, questionsOn: false,
    medItems: {}, customMeds: [], customQuestions: [],
  });

  const screens = {
    home: <HomeScreen go={setScreen} contacts={contacts} setContacts={setContacts} />,
    hydration: <HydrationScreen go={setScreen} colorIdx={colorIdx} setColorIdx={setColorIdx} signs={signs} setSigns={setSigns} cups={cups} setCups={setCups} />,
    scam: <ScamScreen go={setScreen} answers={scamAnswers} setAnswers={setScamAnswers} />,
    doctor: <DoctorScreen go={setScreen} doctor={doctor} setDoctor={setDoctor} hydration={{ colorIdx, signs }} scamAnswers={scamAnswers} />,
  };

  return (
    <div className="w-full min-h-screen flex justify-center" style={{ background: "#DED5C4" }}>
      <style>{FONT_IMPORT}</style>
      <div className="w-full max-w-md min-h-screen relative" style={{ background: COLOR.cream, ...body }}>
        {screens[screen]}
        <BottomNav screen={screen} go={setScreen} />
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<GeriCheckApp />);
</script>
